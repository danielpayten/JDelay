# JDelay - time-shifted HLS radio stream
# On Jetson Nano, build with: docker compose build
# Then run: docker compose up -d
services:
  jdelay:
    build:
      context: .
      platform: linux/arm64
    image: jdelay:latest
    container_name: jdelay
    ports:
      - "8080:8080"
    environment:
      - JDELAY_HTTP_PORT=8080
      - JDELAY_HTTP_DIR=/app/output
    volumes:
      # Persist segments and playlists so buffer survives restarts
      - jdelay_output:/app/output
      # Optional: persist logs on host
      - jdelay_logs:/app/logs
    restart: unless-stopped

volumes:
  jdelay_output:
  jdelay_logs:
